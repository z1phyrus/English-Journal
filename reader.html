<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf8f1">
<title>精读 · 外刊精读</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c5f4a'/%3E%3Ctext x='32' y='46' font-size='40' font-family='Georgia,serif' fill='%23fbf8f1' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('er.prefs.v1') || '{}');
      var t = p.theme || 'auto';
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="reader-bar">
  <div class="wrap reader-bar-inner">
    <a class="icon-btn" href="index.html" title="返回文章库" aria-label="返回文章库">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </a>
    <div class="reader-title" id="bar-title">加载中…</div>
    <span class="rail-pct" id="rail-pct" aria-hidden="true">0%</span>

    <div class="seg" id="seg-lang" role="group" aria-label="对照方式" hidden>
      <button type="button" data-lang="en">原文</button>
      <button type="button" data-lang="zh">双语</button>
    </div>

    <button class="icon-btn" id="font-smaller" title="字号调小" aria-label="字号调小">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M4 19L10 5l6 14M6.4 14.5h7.2"/><path d="M17 15h4"/>
      </svg>
    </button>
    <button class="icon-btn" id="font-larger" title="字号调大" aria-label="字号调大">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M4 19L10 5l6 14M6.4 14.5h7.2"/><path d="M17 15h4M19 13v4"/>
      </svg>
    </button>
    <button class="icon-btn" id="speak-all" title="朗读全文" aria-label="朗读全文">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>
      </svg>
    </button>
    <button class="icon-btn" data-theme-toggle title="切换深浅色" aria-label="切换深浅色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
        <circle cx="12" cy="12" r="3.6"/>
      </svg>
    </button>
  </div>
  <div class="progress-rail"><i id="rail"></i><span class="rail-ticks" id="rail-ticks" aria-hidden="true"></span></div>
</header>

<main class="article-shell">
  <article class="article">
    <header class="article-head" id="head">
      <div class="lib-meta"><span class="chip">加载中</span></div>
      <h1>正在打开文章…</h1>
    </header>
    <div class="article-body" id="body" lang="en"></div>

    <section class="exam" id="exam" hidden>
      <header class="exam-head">
        <span class="exam-kicker">翻译作业</span>
        <span class="exam-meta" id="exam-meta"></span>
      </header>
      <p class="exam-en" id="exam-en" lang="en"></p>
      <label class="exam-label" for="exam-input">先自己译一遍，再看参考译文</label>
      <textarea class="exam-input" id="exam-input" rows="3" spellcheck="false"
        placeholder="把你的译文写在这里，它会存在你自己的浏览器里…"></textarea>
      <div class="exam-actions">
        <button class="btn btn-sm btn-primary" id="exam-reveal" type="button">看参考译文</button>
        <button class="btn btn-sm" id="exam-analysis" type="button" hidden>看句子分析</button>
        <button class="btn btn-sm btn-ghost" id="exam-clear" type="button">清空</button>
        <span class="exam-saved" id="exam-saved" aria-live="polite"></span>
      </div>
      <div class="exam-ref" id="exam-ref" hidden></div>
      <div class="exam-analysis-body" id="exam-analysis-body" hidden></div>
    </section>

    <details class="glossary" id="glossary" hidden>
      <summary>
        <span class="glossary-title">本篇词表</span>
        <span class="glossary-meta" id="glossary-meta"></span>
      </summary>
      <ol class="glossary-list" id="glossary-list"></ol>
    </details>
    <aside class="article-done" id="article-done" hidden>
      <span class="asterism"></span>
      <p class="done-kicker">读完了</p>
      <p class="done-line" id="done-line"></p>
      <div class="done-actions">
        <a class="btn btn-sm btn-primary" id="done-review" href="vocab.html">去复习这一篇的生词</a>
        <a class="btn btn-sm" id="done-next" href="index.html" hidden>下一篇 →</a>
      </div>
    </aside>
    <div class="article-foot">
      <a class="btn btn-sm" href="index.html">← 返回文章库</a>
      <a class="btn btn-sm" href="vocab.html">去复习生词</a>
      <span class="spacer"></span>
      <span class="foot-note">点任意单词查词 · <span class="hint-hover">悬停段落左侧可整段朗读</span><span class="hint-touch">点段落左侧 ▶ 整段朗读</span> · K 键朗读全文</span>
    </div>
  </article>
</main>

<div class="popover" id="popover" role="dialog" aria-label="查词结果">
  <div class="pop-head">
    <div>
      <div class="pop-word" id="pop-word">word</div>
      <div class="pop-phonetic" id="pop-phonetic"></div>
    </div>
    <div class="pop-actions">
      <button class="icon-btn" id="pop-audio" title="朗读单词" aria-label="朗读单词" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M16.5 8.5a5 5 0 010 7"/>
        </svg>
      </button>
      <button class="icon-btn" id="pop-close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="pop-body">
    <div id="pop-zh"></div>
    <div id="pop-defs"></div>
    <div class="pop-note" id="pop-note" hidden></div>
  </div>
  <div class="pop-foot">
    <button class="btn btn-primary btn-sm" id="pop-save" style="flex:1">加入生词本</button>
  </div>
</div>

<script type="module" src="assets/reader.js"></script>
</body>
</html>
